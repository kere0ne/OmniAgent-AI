services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - omni-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  omni-data:
